[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer', 'nodejs-18_x', 'npm']

[phases.install]
cmds = [
  # Create storage directories
  'mkdir -p storage/app storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache',
  'chmod -R 755 storage bootstrap/cache',
  # Create .env from example
  'cp .env.example .env',
  # Install dependencies
  'composer install --no-dev --optimize-autoloader --no-interaction',
  'npm ci --only=production'
]

[phases.build]
cmds = [
  # Ensure directories exist
  'chmod -R 755 storage bootstrap/cache',
  # Build assets first
  'npm run build'
]

[start]
cmd = 'bash start.sh'