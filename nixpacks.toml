[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer', 'nodejs_18']
aptPkgs = ['php-pgsql']



[phases.install]
cmds = [
  # Create storage directories
  'mkdir -p storage/app storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache',
  'chmod -R 755 storage bootstrap/cache',
  # Install dependencies without running post-install scripts
  'composer install --no-dev --optimize-autoloader --no-interaction --no-scripts',
  'npm install'
]

[phases.build]
cmds = [
  # Ensure directories exist
  'chmod -R 755 storage bootstrap/cache',
  # Use production environment file
  'cp .env.production .env',
  # Install dev dependencies needed for build
  'npm install --include=dev',
  # Build assets
  'npm run build',
  # Clean up dev dependencies after build
  'npm prune --production'
]

[start]
cmd = 'php -S 0.0.0.0:$PORT -t public'

[variables]
APP_KEY = '$APP_KEY'
APP_ENV = 'production'  
APP_DEBUG = 'true'
APP_URL = 'https://$RAILWAY_STATIC_URL'
DB_CONNECTION = 'pgsql'
WHATSAPP_VERIFY_TOKEN = 'medico_bot_2025'