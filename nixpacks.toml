[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer', 'nodejs-18_x', 'npm']

[phases.install]
cmds = [
  # Create storage directories
  'mkdir -p storage/app storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache',
  'chmod -R 755 storage bootstrap/cache',
  # Create .env from example
  'cp .env.example .env',
  # Install dependencies without running post-install scripts
  'composer install --no-dev --optimize-autoloader --no-interaction --no-scripts',
  'npm ci --only=production'
]

[phases.build]
cmds = [
  # Ensure directories exist
  'chmod -R 755 storage bootstrap/cache',
  # Build assets first
  'npm run build'
]

[phases.start]
cmds = [
  # Generate app key if needed
  'php -r "if(empty(getenv(\'APP_KEY\'))) { $key = \'base64:\' . base64_encode(random_bytes(32)); file_put_contents(\'.env\', str_replace(\'APP_KEY=\', \'APP_KEY=\' . $key, file_get_contents(\'.env\'))); }"',
  # Run migrations
  'php artisan migrate --force || true'
]

[start]
cmd = 'php -S 0.0.0.0:$PORT server.php'