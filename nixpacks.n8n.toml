[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install] 
cmds = [
  'npm install -g n8n@1.21.1'
]

[phases.build]
cmds = [
  'echo "N8N Setup completed"'
]

[start]
cmd = 'npx n8n start'

[variables]
# Railway essentials
N8N_HOST = '0.0.0.0'
N8N_PORT = '$PORT'

# Basic security  
N8N_BASIC_AUTH_ACTIVE = 'true'
N8N_BASIC_AUTH_USER = 'admin'
N8N_BASIC_AUTH_PASSWORD = 'medico_bot_2025'

# File system storage
N8N_USER_FOLDER = '/tmp/.n8n'
N8N_ENCRYPTION_KEY = 'simple-key-for-railway'