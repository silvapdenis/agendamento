[phases.setup]
nixPkgs = ['nodejs_18']

[phases.install]
cmds = [
  'npm install -g n8n@latest'
]

[phases.build]
cmds = [
  'mkdir -p /tmp/.n8n',
  'echo "N8N_HOST=0.0.0.0" > /tmp/.n8n.env',
  'echo "N8N build phase completed"'
]

[start]
cmd = 'N8N_HOST=0.0.0.0 N8N_PORT=$PORT n8n start'

[variables]
# Basic Configuration - Railway specific
N8N_HOST = '0.0.0.0'
N8N_PORT = '$PORT'
N8N_PROTOCOL = 'https'
N8N_EDITOR_BASE_URL = 'https://$RAILWAY_STATIC_URL'
WEBHOOK_URL = 'https://$RAILWAY_STATIC_URL/webhook'
PORT = '$PORT'

# Disable database for now (use file system)
# Database will be configured later
N8N_USER_FOLDER = '/tmp/.n8n'

# Security
N8N_BASIC_AUTH_ACTIVE = 'true'
N8N_BASIC_AUTH_USER = 'admin'
N8N_BASIC_AUTH_PASSWORD = 'medico_bot_2025'

# Disable encryption for Railway
N8N_ENCRYPTION_KEY = 'n8n-encryption-key-medico-bot-2025'

# Timezone
GENERIC_TIMEZONE = 'America/Sao_Paulo'
TZ = 'America/Sao_Paulo'

# Logging
N8N_LOG_LEVEL = 'debug'

# Laravel Integration
LARAVEL_API_URL = 'https://web-production-317fb.up.railway.app'
WHATSAPP_VERIFY_TOKEN = 'medico_bot_2025'