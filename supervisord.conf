[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
stderr_logfile=/var/log/php-fpm.err.log
stdout_logfile=/var/log/php-fpm.out.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log

[program:laravel-init]
command=/bin/sh -c "sleep 5 && php artisan migrate --force && php artisan key:generate --force"
autostart=true
autorestart=false
stderr_logfile=/var/log/laravel-init.err.log
stdout_logfile=/var/log/laravel-init.out.log